name: Build Windows Desktop .EXE (Forge3D AI Studio)

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows x64 .EXE (Portable & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Production Bundle (Vite + Three.js)
        run: npm run build

      - name: Package Windows Desktop .EXE (Electron Builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: List Generated .EXE Files
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Filter *.exe | Select-Object Name, @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: Upload Windows .EXE Artifacts (Portable & Setup)
        uses: actions/upload-artifact@v4
        with:
          name: Forge3D-AI-Studio-Windows-EXE
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30
