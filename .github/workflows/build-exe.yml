name: Build Windows Desktop .EXE (Forge3D AI Studio)

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-exe:
    name: Build Windows x64 .EXE (Portable & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Production Bundle (Vite + Three.js)
        run: npm run build

      - name: Package Windows Desktop .EXE (Electron Builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: List Generated .EXE Files
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Filter *.exe | Select-Object Name, @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: Upload Windows .EXE Artifacts (Portable & Setup)
        uses: actions/upload-artifact@v4
        with:
          name: Forge3D-AI-Studio-Windows-EXE
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish .EXE Files to GitHub Release (v1.0.0 Latest) for Direct Website Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: Forge3D AI Studio v1.0.0 (Windows PC x64)
          body: |
            ## Forge3D AI Studio v1.0.0 — Official Windows PC (64-Bit) Release
            - **Forge3D-AI-Studio-Portable-x64.exe** — Portable Windows `.exe` (No installation needed, double-click to launch)
            - **Forge3D-AI-Studio-Setup-x64.exe** — Standard Windows Installer (Creates Desktop & Start Menu shortcuts)
          draft: false
          prerelease: false
          files: |
            release/Forge3D-AI-Studio-Portable-x64.exe
            release/Forge3D-AI-Studio-Setup-x64.exe
