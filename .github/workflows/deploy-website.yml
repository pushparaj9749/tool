name: Deploy Official Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync-website-branch:
    name: Sync Website to Main for GitHub Pages Policy
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update main branch ref for GitHub Pages deployment
        run: |
          git push origin HEAD:refs/heads/main --force

  deploy-website:
    name: Deploy Product Website (website/ folder only)
    if: github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website Static Files (website/ folder only — NOT the desktop software)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
