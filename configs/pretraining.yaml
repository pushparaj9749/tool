# Pretraining run configuration (100M target)
run_name: ankit-100m-pretrain-v0.1
model_config: configs/model.yaml
tokenizer_dir: tokenizer/ankit_bpe
data_dir: data/processed
train_bin: data/processed/pretrain_train.bin
val_bin: data/processed/pretrain_val.bin

# Optimisation
batch_size: 4
grad_accum_steps: 4
seq_len: 512
max_steps: 40000          # documented stopping criterion for a full run
learning_rate: 6.0e-4
min_lr_ratio: 0.1
warmup_steps: 1000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
lr_schedule: cosine
optimizer: adamw

# Runtime
dtype: auto               # bf16/fp16 on CUDA, fp32 on CPU
device: auto
seed: 1337
num_workers: 0
log_every: 10
eval_every: 250
eval_batches: 20
save_every: 1000
keep_last_checkpoints: 3
checkpoint_dir: checkpoints/pretrain-100m
log_dir: logs
storage_min_free_gb: 2.0
resume: auto
