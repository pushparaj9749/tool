# Custom BPE tokenizer, trained from scratch on the ANKIT corpus only.
type: byte_level_bpe      # byte-level: full Unicode safety, no <unk> for any script
vocab_size: 32768
min_frequency: 2
max_token_length: 16
byte_level_pretokenizer: true
add_prefix_space: false
lowercase: false
# Corpus used for tokenizer training (built by data/prepare_data.py)
train_corpus: data/processed/tokenizer_corpus.txt
expected_scripts: [Devanagari, Latin]
special_tokens:
  - "<pad>"
  - "<unk>"
  - "<bos>"
  - "<eos>"
  - "<|system|>"
  - "<|user|>"
  - "<|assistant|>"
  - "<|end|>"
