# Instruction tuning for the 100M MODEL (CPU-only host)
#
# Same architecture as the pretrained checkpoint (97,435,392 params) — nothing shrunk.
# Prompt tokens are masked, so gradients come only from assistant content.
# 2 epochs over ~500 examples at batch 2 x seq 256 (~4.3 s/step on 2 vCPU) ≈ 35 min.
run_name: ankit-100m-sft
init_checkpoint: checkpoints/pretrain-100m-main/final.pt
model_config: configs/model.yaml
tokenizer_dir: tokenizer/ankit_bpe
sft_data: data/sft/sft_train.jsonl
sft_val_data: data/sft/sft_val.jsonl

epochs: 2
batch_size: 2
grad_accum_steps: 1
seq_len: 256
learning_rate: 2.0e-4
min_lr_ratio: 0.1
warmup_steps: 20
weight_decay: 0.05
grad_clip: 1.0
beta1: 0.9
beta2: 0.95
lr_schedule: cosine
optimizer: adamw
mask_prompt_tokens: true
dtype: fp32
device: cpu
seed: 2024
log_every: 10
eval_every: 50
eval_batches: 8
save_every: 100
checkpoint_dir: checkpoints/sft-100m
log_dir: logs
storage_min_free_gb: 2.0
resume: auto
