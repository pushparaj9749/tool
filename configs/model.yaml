# ANKIT LLM v0.1 — primary model configuration (~100M trainable parameters)
# Decoder-only Transformer, RoPE, RMSNorm, SwiGLU, tied embeddings, no biases.
name: ankit-100m
vocab_size: 32768
d_model: 768
n_layers: 10
n_heads: 12
d_ff: 2112            # SwiGLU hidden size (3 matrices: gate, up, down)
max_seq_len: 512
rope_theta: 10000.0
rms_norm_eps: 1.0e-5
dropout: 0.0
tie_word_embeddings: true
attention_bias: false
initializer_range: 0.02
