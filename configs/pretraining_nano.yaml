# Pretraining run configuration (nano / CPU-feasible pilot)
run_name: ankit-nano-pretrain-v0.1
model_config: configs/model_nano.yaml
tokenizer_dir: tokenizer/ankit_bpe
data_dir: data/processed
train_bin: data/processed/pretrain_train.bin
val_bin: data/processed/pretrain_val.bin

batch_size: 8
grad_accum_steps: 1
seq_len: 256
max_steps: 2000
learning_rate: 1.0e-3
min_lr_ratio: 0.1
warmup_steps: 100
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
lr_schedule: cosine
optimizer: adamw

dtype: fp32
device: cpu
seed: 1337
num_workers: 0
log_every: 10
eval_every: 50
eval_batches: 20
save_every: 50
keep_last_checkpoints: 3
checkpoint_dir: checkpoints/pretrain-nano
log_dir: logs
storage_min_free_gb: 2.0
resume: auto
