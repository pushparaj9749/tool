# Supervised instruction / conversational fine-tuning
run_name: ankit-sft-v0.1
# Base checkpoint to fine-tune from (pretrained, randomly initialised at step 0).
init_checkpoint: checkpoints/pretrain-nano/final.pt
model_config: configs/model_nano.yaml
tokenizer_dir: tokenizer/ankit_bpe
sft_data: data/sft/sft_train.jsonl
sft_val_data: data/sft/sft_val.jsonl

epochs: 3
batch_size: 4
grad_accum_steps: 2
seq_len: 256            # matches the nano model's max_seq_len
learning_rate: 2.0e-4
min_lr_ratio: 0.1
warmup_steps: 20
weight_decay: 0.05
grad_clip: 1.0
beta1: 0.9
beta2: 0.95
lr_schedule: cosine
optimizer: adamw
mask_prompt_tokens: true     # loss only on assistant turns
dtype: fp32
device: cpu
seed: 2024
log_every: 5
eval_every: 25
save_every: 100
checkpoint_dir: checkpoints/sft-v0.1
log_dir: logs
storage_min_free_gb: 2.0
resume: auto
