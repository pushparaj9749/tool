# ANKIT LLM v0.1 — Colab T4 FULL pretraining target
#
# Same 97,435,392-parameter architecture. This config is resumable: the cosine
# schedule is anchored to max_steps, so a Colab disconnect + resume continues on
# exactly the same curve.
#
# DATA-BOUND, NOT CHINCHILLA. The corpus is 24,100,344 train tokens, so:
#   1 epoch          = 24,100,344 / 8,192  = 2,941 steps
#   64,000 steps     = 524,288,000 tokens  = ~21.8 epochs  <- this config
# A 2B-token run would be ~83 epochs over the same 24.1M tokens: that memorises the
# corpus instead of learning the language. 20-25 epochs is the honest ceiling until
# more data is acquired, and the cosine schedule is sized to match.
# Budget: 16 x 1 x 512 = 8,192 tokens/step. Measured 13.7-14.7k tok/s on the T4
# (1.7 steps/s) -> 64,000 steps = ~10.5 GPU-hours = ~2 Colab sessions.
run_name: ankit-100m-t4-full
model_config: configs/model.yaml
tokenizer_dir: tokenizer/ankit_bpe
data_dir: data/processed
train_bin: data/processed/pretrain_train.bin
val_bin: data/processed/pretrain_val.bin

batch_size: 8
grad_accum_steps: 2
seq_len: 512
max_steps: 64000           # ~524M tokens = 21.8 epochs over 24.1M tokens (~2 sessions)
learning_rate: 6.0e-4
min_lr_ratio: 0.1
warmup_steps: 2000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
lr_schedule: cosine
optimizer: adamw

dtype: auto
device: auto
seed: 1337
num_workers: 0
log_every: 20
eval_every: 500
eval_batches: 8
save_every: 200             # ~every 1.6M tokens; the Drive copy runs in the background
keep_last_checkpoints: 2
checkpoint_dir: checkpoints/t4-full
log_dir: logs
storage_min_free_gb: 3.0
resume: auto
mirror_dir: /content/drive/MyDrive/ankit-llm/checkpoints/t4-full
# Async mirror. Measured on the T4: a 1.27 GB Drive copy takes ~17 s (~7% of the
# 200 steps it covers), and the async thread keeps even that off the critical path,
# coalescing to the newest checkpoint.
mirror_keep: 2              # newest N .pt files kept in the Drive mirror
mirror_flush_timeout_s: 1800  # wait this long for the final copy before exiting
heartbeat_every: 100          # tiny heartbeat.json on Drive: "how far did training really get?"
mirror_max_lag_steps: 600     # shout if the newest Drive checkpoint is this far behind
mirror_max_age_s: 1800        # or if nothing has been mirrored for this long
